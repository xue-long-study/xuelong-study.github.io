<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博文｜本地相框相册｜自动读取增强版</title>
  <style>
    :root{
      --bg0:#030617;
      --bg1:#061631;
      --bg2:#160d35;
      --glass:rgba(255,255,255,.085);
      --glass2:rgba(255,255,255,.14);
      --line:rgba(255,255,255,.16);
      --line2:rgba(125,211,252,.44);
      --text:#f8fbff;
      --muted:#9fb5d8;
      --cyan:#22d3ee;
      --blue:#3b82f6;
      --violet:#8b5cf6;
      --pink:#ec4899;
      --green:#34d399;
      --warn:#fbbf24;
      --danger:#fb7185;
      --shadow:0 28px 90px rgba(0,0,0,.44);
      --radius:30px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--text);
      overflow-x:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(34,211,238,.34), transparent 28%),
        radial-gradient(circle at 82% 8%, rgba(236,72,153,.24), transparent 28%),
        radial-gradient(circle at 58% 86%, rgba(59,130,246,.24), transparent 34%),
        linear-gradient(135deg,var(--bg0) 0%,var(--bg1) 46%,var(--bg2) 100%);
    }

    body::before,
    body::after{
      content:"";
      position:fixed;
      z-index:-3;
      pointer-events:none;
      border-radius:999px;
      filter:blur(10px);
    }
    body::before{
      width:740px;height:740px;
      left:-310px;top:-260px;
      background:conic-gradient(from 210deg,rgba(34,211,238,.28),rgba(59,130,246,.18),rgba(139,92,246,.24),rgba(34,211,238,.28));
      animation:orbA 20s ease-in-out infinite alternate;
    }
    body::after{
      width:620px;height:620px;
      right:-260px;bottom:-280px;
      background:conic-gradient(from 40deg,rgba(236,72,153,.22),rgba(59,130,246,.20),rgba(34,211,238,.22),rgba(236,72,153,.22));
      animation:orbB 24s ease-in-out infinite alternate-reverse;
    }
    @keyframes orbA{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(95px,48px,0) rotate(36deg)}}
    @keyframes orbB{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(-70px,-40px,0) rotate(-34deg)}}

    .space-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden}
    .space-bg::before{
      content:"";position:absolute;inset:0;opacity:.50;
      background-image:
        linear-gradient(rgba(125,211,252,.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(125,211,252,.08) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.8) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(125,211,252,.7) 0 1px, transparent 1.6px);
      background-size:72px 72px,72px 72px,92px 92px,146px 146px;
      background-position:center,center,0 0,34px 60px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.78),rgba(0,0,0,.32),rgba(0,0,0,.12));
    }
    .space-bg::after{
      content:"";position:absolute;left:-40%;top:18%;width:180%;height:210px;opacity:.26;
      background:linear-gradient(90deg,transparent,rgba(34,211,238,.18),rgba(139,92,246,.12),transparent);
      transform:rotate(-8deg);
      animation:lightFlow 10s ease-in-out infinite alternate;
    }
    @keyframes lightFlow{from{transform:translateX(-80px) rotate(-8deg)}to{transform:translateX(80px) rotate(-8deg)}}

    .shell{width:min(1240px,calc(100% - 36px));margin:28px auto 56px;}

    .hero{
      position:relative;overflow:hidden;
      border:1px solid var(--line);
      border-radius:38px;
      background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.055));
      backdrop-filter:blur(24px);
      box-shadow:var(--shadow);
      padding:32px;
    }
    .hero::before{
      content:"";position:absolute;inset:-1px;pointer-events:none;
      background:
        radial-gradient(circle at 76% 22%,rgba(34,211,238,.18),transparent 30%),
        radial-gradient(circle at 90% 6%,rgba(236,72,153,.16),transparent 24%),
        linear-gradient(90deg,rgba(34,211,238,.12),transparent 48%,rgba(139,92,246,.12));
    }
    .hero::after{
      content:"";position:absolute;right:34px;top:28px;width:172px;height:172px;border-radius:50%;
      border:1px solid rgba(125,211,252,.24);
      background:radial-gradient(circle,rgba(34,211,238,.12),transparent 60%);
      box-shadow:0 0 70px rgba(34,211,238,.12), inset 0 0 40px rgba(255,255,255,.05);
      opacity:.8;
    }
    .hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.45fr .72fr;gap:26px;align-items:center;}
    .eyebrow{
      display:inline-flex;align-items:center;gap:9px;
      padding:8px 14px;border-radius:999px;
      border:1px solid rgba(125,211,252,.38);
      background:rgba(3,7,18,.42);
      color:#d9fbff;font-size:13px;font-weight:1000;
      box-shadow:inset 0 0 24px rgba(34,211,238,.08);
    }
    h1{margin:16px 0 10px;font-size:50px;line-height:1.04;letter-spacing:-1.2px;}
    .title-gradient{
      background:linear-gradient(90deg,#fff 0%,#bff8ff 34%,#d9ccff 66%,#ffffff 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      text-shadow:0 20px 60px rgba(34,211,238,.20);
    }
    .subtitle{margin:0;max-width:760px;color:var(--muted);font-size:15px;line-height:1.85;font-weight:720;}

    .reader-card{
      border:1px solid rgba(255,255,255,.16);
      border-radius:28px;
      background:rgba(3,7,18,.32);
      box-shadow:inset 0 0 50px rgba(59,130,246,.08),0 20px 60px rgba(0,0,0,.18);
      padding:18px;
    }
    .reader-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;}
    .reader-row b{font-size:15px;line-height:1.45;}
    .status-dot{width:13px;height:13px;border-radius:999px;background:var(--warn);box-shadow:0 0 22px var(--warn);flex:0 0 auto;}
    .status-dot.ok{background:var(--green);box-shadow:0 0 24px var(--green)}
    .status-dot.err{background:var(--danger);box-shadow:0 0 24px var(--danger)}
    .progress{height:10px;border-radius:999px;overflow:hidden;background:rgba(148,163,184,.20);border:1px solid rgba(255,255,255,.11);}
    .progress i{display:block;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet),var(--pink));box-shadow:0 0 24px rgba(34,211,238,.48);transition:width .18s ease;}
    .progress.loading i{width:34%;animation:scan 1.15s ease-in-out infinite;}
    @keyframes scan{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
    .status-text{margin:12px 0 0;color:#d2e7ff;font-size:13px;line-height:1.65;font-weight:850;}

    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 18px;}
    .stat{
      min-height:86px;padding:17px 18px;border-radius:26px;
      border:1px solid rgba(255,255,255,.13);
      background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
      backdrop-filter:blur(18px);
      box-shadow:0 14px 44px rgba(0,0,0,.20);
    }
    .stat b{display:block;font-size:28px;line-height:1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .stat span{display:block;margin-top:10px;color:#9fb5d8;font-size:13px;font-weight:950;}

    .panel{
      position:relative;
      border:1px solid rgba(255,255,255,.15);
      border-radius:38px;
      background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
      backdrop-filter:blur(24px);
      box-shadow:var(--shadow);
      padding:22px;
      min-height:430px;
      overflow:hidden;
    }
    .panel::before{
      content:"";position:absolute;left:22px;right:22px;top:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(125,211,252,.58),rgba(236,72,153,.38),transparent);
      opacity:.9;
    }
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;position:relative;z-index:1;}
    .panel-title{display:flex;align-items:center;gap:11px;font-size:20px;font-weight:1000;letter-spacing:.2px;}
    .panel-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(139,92,246,.20));border:1px solid rgba(125,211,252,.26);box-shadow:inset 0 0 26px rgba(255,255,255,.05);}
    .album-path{max-width:45%;color:#a9bddc;font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .notice{
      display:grid;place-items:center;text-align:center;
      min-height:348px;border-radius:30px;
      border:1px dashed rgba(125,211,252,.36);
      background:radial-gradient(circle at 50% 8%,rgba(34,211,238,.14),transparent 35%),rgba(3,7,18,.25);
      padding:30px;position:relative;z-index:1;
    }
    .notice.hidden{display:none;}
    .notice-orb{
      width:104px;height:104px;border-radius:32px;margin:0 auto 20px;display:grid;place-items:center;font-size:44px;
      background:linear-gradient(135deg,rgba(34,211,238,.28),rgba(59,130,246,.18),rgba(139,92,246,.25));
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 24px 70px rgba(34,211,238,.16),inset 0 0 36px rgba(255,255,255,.08);
    }
    .notice h2{margin:0 0 10px;font-size:27px;letter-spacing:-.4px;}
    .notice p{margin:8px auto 0;max-width:740px;color:#a9bddc;line-height:1.85;font-weight:800;}
    .notice .focus{color:#dffcff;font-weight:1000;}

    .album-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;position:relative;z-index:1;}
    .album-grid.hidden{display:none;}
    .album-card{
      position:relative;overflow:hidden;min-height:318px;border-radius:28px;cursor:pointer;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(3,7,18,.36);
      box-shadow:0 18px 48px rgba(0,0,0,.24);
      transform:translateY(12px);
      opacity:0;
      animation:cardIn .52s ease forwards;
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .album-card:hover{transform:translateY(-8px);border-color:rgba(125,211,252,.55);box-shadow:0 30px 74px rgba(0,0,0,.36),0 0 0 1px rgba(34,211,238,.12)}
    @keyframes cardIn{to{opacity:1;transform:translateY(0)}}
    .album-cover{height:220px;position:relative;overflow:hidden;background:rgba(148,163,184,.16);}
    .album-cover img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .48s ease,filter .48s ease;}
    .album-card:hover .album-cover img{transform:scale(1.07);filter:saturate(1.08) contrast(1.05);}
    .album-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 32%,rgba(3,7,18,.84));}
    .cover-chip{position:absolute;left:12px;top:12px;z-index:2;padding:7px 10px;border-radius:999px;background:rgba(3,7,18,.60);color:#dffcff;font-size:12px;font-weight:1000;border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(12px);}
    .album-body{padding:15px 15px 17px;}
    .album-title{margin:0 0 12px;font-size:18px;line-height:1.35;font-weight:1000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .meta{display:flex;gap:8px;flex-wrap:wrap;}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.095);border:1px solid rgba(255,255,255,.12);color:#dbeafe;font-size:12px;font-weight:1000;}
    .pill.cyan{color:#c9fbff;background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.24)}
    .pill.green{color:#d1fae5;background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.24)}

    .gallery-head{display:none;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;position:relative;z-index:1;}
    .gallery-head.active{display:flex;}
    .back{
      border:1px solid rgba(125,211,252,.34);outline:none;cursor:pointer;
      padding:10px 15px;border-radius:999px;
      color:#e0fbff;background:rgba(3,7,18,.35);
      font-weight:1000;backdrop-filter:blur(12px);
      transition:.18s ease;
    }
    .back:hover{transform:translateY(-2px);background:rgba(34,211,238,.13);border-color:rgba(125,211,252,.55)}
    .current-title{font-size:22px;font-weight:1000;line-height:1.35;text-align:right;}

    .photo-grid{display:none;grid-template-columns:repeat(4,1fr);gap:17px;position:relative;z-index:1;}
    .photo-grid.active{display:grid;}
    .photo{
      position:relative;overflow:hidden;border-radius:28px;cursor:zoom-in;
      border:1px solid rgba(255,255,255,.15);
      background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.055));
      box-shadow:0 18px 48px rgba(0,0,0,.24);
      padding:10px;
      transform:translateY(12px);opacity:0;animation:cardIn .52s ease forwards;
      transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
    }
    .photo::before{
      content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
      background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 34%,rgba(34,211,238,.08));
    }
    .photo:hover{transform:translateY(-7px) scale(1.008);border-color:rgba(125,211,252,.58);box-shadow:0 30px 74px rgba(0,0,0,.36),0 0 42px rgba(34,211,238,.09)}
    .frame-img{position:relative;border-radius:22px;overflow:hidden;background:rgba(148,163,184,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);}
    .frame-img img{width:100%;height:268px;display:block;object-fit:cover;transition:transform .48s ease,filter .48s ease;}
    .photo:hover img{transform:scale(1.055);filter:saturate(1.06) contrast(1.035);}
    .photo-info{position:relative;padding:11px 4px 2px;}
    .photo-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:1000;color:#f5fbff;}
    .photo-info span{display:block;margin-top:6px;color:#98b0d4;font-size:12px;font-weight:900;}

    .lightbox{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.76);backdrop-filter:blur(16px);}
    .lightbox.active{display:flex;}
    .lightbox-img{max-width:min(96vw,1380px);max-height:86vh;width:auto;height:auto;object-fit:contain;border-radius:24px;border:1px solid rgba(255,255,255,.18);background:#020617;box-shadow:0 34px 130px rgba(0,0,0,.78);}
    .lightbox-caption{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(800px,calc(100% - 28px));text-align:center;color:#eaf8ff;font-weight:950;padding:10px 14px;border-radius:999px;background:rgba(3,7,18,.58);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lightbox-btn{position:fixed;z-index:90;border:1px solid rgba(255,255,255,.18);outline:none;cursor:pointer;background:rgba(3,7,18,.58);color:white;width:48px;height:48px;border-radius:999px;display:grid;place-items:center;font-size:25px;font-weight:1000;backdrop-filter:blur(14px);transition:.18s ease;}
    .lightbox-btn:hover{background:rgba(34,211,238,.22);transform:scale(1.05);}
    .lightbox-close{right:22px;top:22px;}
    .lightbox-prev{left:22px;top:50%;transform:translateY(-50%);}
    .lightbox-prev:hover{transform:translateY(-50%) scale(1.05);}
    .lightbox-next{right:22px;top:50%;transform:translateY(-50%);}
    .lightbox-next:hover{transform:translateY(-50%) scale(1.05);}

    .toast{position:fixed;right:20px;bottom:20px;z-index:100;display:none;max-width:420px;padding:14px 16px;border-radius:18px;background:rgba(3,7,18,.78);border:1px solid rgba(125,211,252,.3);color:#e8fbff;font-weight:950;line-height:1.55;backdrop-filter:blur(14px);box-shadow:0 24px 70px rgba(0,0,0,.38);}
    .toast.active{display:block;animation:toastIn .22s ease;}
    @keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    input[type=file]{position:absolute;left:-9999px;width:1px;height:1px;opacity:0;}

    @media(max-width:1080px){
      .hero-inner{grid-template-columns:1fr;}
      h1{font-size:42px;}
      .album-grid,.photo-grid{grid-template-columns:repeat(3,1fr);}
    }
    @media(max-width:780px){
      .shell{width:calc(100% - 22px);margin:14px auto 34px;}
      .hero,.panel{border-radius:26px;padding:18px;}
      h1{font-size:32px;}
      .subtitle{font-size:14px;}
      .stats{grid-template-columns:1fr;gap:10px;}
      .album-grid,.photo-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
      .album-cover{height:168px;}
      .frame-img img{height:214px;}
      .panel-head,.gallery-head{align-items:flex-start;flex-direction:column;}
      .album-path{max-width:100%;}
      .current-title{text-align:left;font-size:20px;}
    }
    @media(max-width:500px){
      .album-grid,.photo-grid{grid-template-columns:1fr;}
      .album-cover{height:238px;}
      .frame-img img{height:280px;}
      .lightbox-prev,.lightbox-next{display:none;}
      .lightbox{padding:14px;}
    }

    /* 开阳老师课程案例版：顶部更扁、相册更大、去掉英文角标 */
    .shell{width:min(1320px,calc(100% - 32px));margin:22px auto 48px;}
    .hero{
      border-radius:28px;
      padding:18px 26px;
      box-shadow:0 20px 62px rgba(0,0,0,.36);
    }
    .hero::after{width:118px;height:118px;right:42px;top:22px;opacity:.52;}
    .hero-inner{grid-template-columns:1.35fr .62fr;gap:20px;}
    .eyebrow{padding:6px 12px;font-size:12px;}
    h1{margin:10px 0 6px;font-size:38px;line-height:1.02;letter-spacing:-.8px;}
    .subtitle{font-size:14px;line-height:1.55;}
    .reader-card{border-radius:22px;padding:14px 16px;}
    .reader-row{margin-bottom:9px;}
    .reader-row b{font-size:14px;}
    .progress{height:8px;}
    .status-text{margin:8px 0 0;font-size:12px;line-height:1.45;}
    .stats{grid-template-columns:1fr 1fr 1.15fr;gap:12px;margin:12px 0 18px;}
    .stat{min-height:70px;border-radius:22px;padding:14px 18px;}
    .stat b{font-size:25px;}
    .stat span{margin-top:8px;font-size:12px;}

    .panel{padding:26px;border-radius:36px;}
    .panel-head{margin-bottom:24px;}
    .panel-title{font-size:26px;letter-spacing:.4px;}
    .panel-icon{width:42px;height:42px;border-radius:16px;font-size:21px;}
    .album-path{font-size:14px;color:#c7d7f2;}

    .album-grid{grid-template-columns:repeat(3,1fr);gap:24px;}
    .album-card{min-height:400px;border-radius:30px;}
    .album-cover{height:292px;}
    .album-body{padding:18px 18px 20px;}
    .album-title{
      margin:0 0 15px;
      font-size:24px;
      line-height:1.25;
      letter-spacing:.2px;
      text-shadow:0 8px 22px rgba(0,0,0,.42);
    }
    .pill{font-size:13px;padding:8px 12px;}
    .cover-chip{display:none!important;}

    @media(max-width:1080px){
      .hero-inner{grid-template-columns:1fr;}
      .album-grid{grid-template-columns:repeat(2,1fr);}
      h1{font-size:34px;}
    }
    @media(max-width:780px){
      .shell{width:calc(100% - 22px);margin:14px auto 34px;}
      .hero,.panel{border-radius:26px;padding:18px;}
      .stats{grid-template-columns:1fr;gap:10px;}
      .album-grid{grid-template-columns:repeat(2,1fr);gap:14px;}
      .album-cover{height:220px;}
      .album-card{min-height:330px;}
      .album-title{font-size:21px;}
      .panel-title{font-size:23px;}
    }
    @media(max-width:500px){
      .album-grid{grid-template-columns:1fr;}
      .album-cover{height:260px;}
      .album-card{min-height:360px;}
    }

  </style>
</head>
<body>
  <div class="space-bg"></div>
  <input id="folderInput" type="file" webkitdirectory directory multiple accept="image/*" />

  <main class="shell">
    <section class="hero">
      <div class="hero-inner">
        <div>
          <span class="eyebrow">博文相册</span>
          <h1><span class="title-gradient">博文相册</span></h1>
          <p class="subtitle">本地图片相框展示 · 按子文件夹生成相册 · 点击图片查看大图</p>
        </div>
        <div class="reader-card">
          <div class="reader-row">
            <b id="statusTitle">正在准备读取本地相册</b>
            <span class="status-dot" id="statusDot"></span>
          </div>
          <div class="progress loading" id="progress"><i id="progressBar"></i></div>
          <p class="status-text" id="statusText">当前为全新未读取状态；首次点击页面选择总相册文件夹。</p>
        </div>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><b id="albumCount">0</b><span>相册分类</span></div>
      <div class="stat"><b id="photoCount">0</b><span>图片总数</span></div>
      <div class="stat"><b id="rootName">未读取</b><span>目录状态</span></div>
    </section>

    <section class="panel">
      <div class="panel-head" id="listHead">
        <div class="panel-title"><span class="panel-icon">✦</span><span>私人数字展厅</span></div>
        <div class="album-path" id="albumPath"></div>
      </div>

      <div class="gallery-head" id="galleryHead">
        <button class="back" id="backBtn">← 返回全部相册</button>
        <div class="current-title" id="currentAlbumTitle"></div>
      </div>

      <div class="notice" id="notice">
        <div>
          <div class="notice-orb">🖼️</div>
          <h2 id="noticeTitle">等待读取相册目录</h2>
          <p id="noticeText">如果这是首次打开，点击页面任意位置选择总文件夹。</p>
          <p class="focus" id="noticeHint">目录结构：总文件夹 / 子文件夹 / 图片</p>
        </div>
      </div>

      <div class="album-grid hidden" id="albumGrid"></div>
      <div class="photo-grid" id="photoGrid"></div>
    </section>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-btn lightbox-close" id="lightboxClose" title="关闭">×</button>
    <button class="lightbox-btn lightbox-prev" id="lightboxPrev" title="上一张">‹</button>
    <img class="lightbox-img" id="lightboxImg" alt="预览图片" />
    <button class="lightbox-btn lightbox-next" id="lightboxNext" title="下一张">›</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const imageExts = new Set(['jpg','jpeg','png','gif','webp','bmp','svg','avif','ico']);
    const DB_NAME = 'kaiyang-local-frame-album-db-fixed-path-v1';
    const LEGACY_DB_NAMES = ['kaiyang-local-frame-album-db-v2','kaiyang-local-frame-album-db','ai-gallery-local-frame-db'];
    const RESET_MARK_KEY = 'kaiyang-fixed-path-directory-reset-done-v1';
    const STORE = 'handles';
    const HANDLE_KEY = 'lastRootDirectoryHandle';
    const HARD_CODED_LOCAL_PATH = String.raw`C:\Users\EDY\Desktop\python正式课\day07静态网页爬虫入门壁纸下载器\福利代码1本地相册效果展示`;
    const PICKER_ID = 'kaiyang-course-album';

    const folderInput = document.getElementById('folderInput');
    const statusTitle = document.getElementById('statusTitle');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progressBar');
    const notice = document.getElementById('notice');
    const noticeTitle = document.getElementById('noticeTitle');
    const noticeText = document.getElementById('noticeText');
    const noticeHint = document.getElementById('noticeHint');
    const albumGrid = document.getElementById('albumGrid');
    const photoGrid = document.getElementById('photoGrid');
    const galleryHead = document.getElementById('galleryHead');
    const listHead = document.getElementById('listHead');
    const currentAlbumTitle = document.getElementById('currentAlbumTitle');
    const backBtn = document.getElementById('backBtn');
    const albumCount = document.getElementById('albumCount');
    const photoCount = document.getElementById('photoCount');
    const rootName = document.getElementById('rootName');
    const albumPath = document.getElementById('albumPath');
    const toast = document.getElementById('toast');

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const lightboxClose = document.getElementById('lightboxClose');
    const lightboxPrev = document.getElementById('lightboxPrev');
    const lightboxNext = document.getElementById('lightboxNext');

    let albums = [];
    let objectUrls = [];
    let currentPhotos = [];
    let currentPhotoIndex = 0;
    let waitingForUserGesture = false;
    let pendingSavedHandle = null;

    init();

    async function init(){
      bindEvents();
      await requestPersistentStorageMaybe();
      await clearOldDirectoryCacheOnce();
      setStatus('正在读取固定相册目录','已写入固定相册路径，正在尝试自动导入……',16,true);

      // 固定路径自动读取：仅在支持 ActiveX 的本地环境中可以真正“零点击”按 C 盘路径扫描。
      // Chrome / Edge 出于安全限制，不允许普通 HTML 直接枚举 C:\Users\... 文件夹。
      const fixedPathLoaded = tryHardCodedPathAutoLoad();
      if(fixedPathLoaded === true) return;

      // Chrome / Edge 环境：如果之前已经授权过这个固定目录，优先自动恢复读取。
      const restored = await tryLoadSavedDirectory();
      if(restored === true) return;

      if(restored === 'need-click-permission'){
        showWaitingForClick(
          '点击恢复固定相册目录',
          '已找到之前授权过的相册目录，但浏览器需要再次确认读取权限。点击页面任意位置即可恢复。',
          '固定路径已写入 HTML；如果浏览器长期保存权限，后续会自动进入相册。'
        );
        return;
      }

      showWaitingForClick(
        '点击授权固定相册目录',
        '当前浏览器不允许 HTML 直接按 C 盘路径自动读取。请首次选择固定相册文件夹；授权成功后，下次会优先自动读取。',
        '请选择：C:\\Users\\EDY\\Desktop\\python正式课\\day07静态网页爬虫入门壁纸下载器\\福利代码1本地相册效果展示'
      );
    }

    function bindEvents(){
      backBtn.addEventListener('click', showAlbums);
      folderInput.addEventListener('change', async (event) => {
        const files = Array.from(event.target.files || []).filter(isImageFile);
        folderInput.value = '';
        if(!files.length){
          showWaitingForClick('没有读取到图片','请选择包含子文件夹图片的总目录。');
          return;
        }
        await loadFromFileList(files);
      });

      document.addEventListener('click', async () => {
        if(!waitingForUserGesture) return;
        waitingForUserGesture = false;
        await handleDirectoryUserGesture();
      }, {capture:true});

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => { if(event.target === lightbox) closeLightbox(); });
      lightboxPrev.addEventListener('click', () => stepLightbox(-1));
      lightboxNext.addEventListener('click', () => stepLightbox(1));
      document.addEventListener('keydown', (event) => {
        if(!lightbox.classList.contains('active')) return;
        if(event.key === 'Escape') closeLightbox();
        if(event.key === 'ArrowLeft') stepLightbox(-1);
        if(event.key === 'ArrowRight') stepLightbox(1);
      });
    }

    async function tryLoadSavedDirectory(){
      if(!supportsFileSystemAccess()) return false;
      try{
        const handle = await getStoredHandle();
        if(!handle) return false;
        pendingSavedHandle = handle;
        setStatus('正在自动读取上次目录','已找到上次保存的目录，正在检查浏览器读取权限……',30,true);
        const permission = await handle.queryPermission({mode:'read'});
        if(permission === 'granted'){
          await loadFromDirectoryHandle(handle);
          return true;
        }
        return 'need-click-permission';
      }catch(error){
        console.warn('读取上次目录失败：', error);
        pendingSavedHandle = null;
        return false;
      }
    }

    async function handleDirectoryUserGesture(){
      if(pendingSavedHandle && supportsFileSystemAccess()){
        try{
          setStatus('正在恢复上次目录','正在请求恢复上次相册目录的读取权限……',42,true);
          const permission = await pendingSavedHandle.requestPermission({mode:'read'});
          if(permission === 'granted'){
            await storeHandle(pendingSavedHandle);
            await loadFromDirectoryHandle(pendingSavedHandle);
            return;
          }
          showToast('浏览器未允许恢复上次目录，请重新选择一次图片总文件夹');
        }catch(error){
          console.warn('恢复上次目录失败：', error);
          showToast('上次目录权限恢复失败，请重新选择一次图片总文件夹');
        }
        pendingSavedHandle = null;
      }
      await openDirectoryByUserGesture();
    }

    async function openDirectoryByUserGesture(){
      if(supportsFileSystemAccess()){
        try{
          setStatus('正在打开本地目录','请选择图片总文件夹，系统会读取它下面的子文件夹图片。',45,true);
          const handle = await window.showDirectoryPicker({mode:'read', id:PICKER_ID, startIn:'desktop'});
          pendingSavedHandle = handle;
          await requestPersistentStorageMaybe();
          await storeHandle(handle);
          await loadFromDirectoryHandle(handle);
          return;
        }catch(error){
          console.warn('showDirectoryPicker 失败，启用兼容模式：', error);
          showToast('目录授权未完成，可再次点击页面继续选择');
          waitingForUserGesture = true;
        }
      }
      try{
        folderInput.click();
      }catch(error){
        showError('无法打开目录选择','请使用新版 Chrome / Edge 打开本文件。');
      }
    }

    async function requestPersistentStorageMaybe(){
      try{
        if(navigator.storage && navigator.storage.persist){
          const alreadyPersisted = await navigator.storage.persisted();
          if(!alreadyPersisted) await navigator.storage.persist();
        }
      }catch(error){
        console.warn('持久化本地存储请求失败：', error);
      }
    }

    function supportsFileSystemAccess(){
      return 'showDirectoryPicker' in window && 'indexedDB' in window;
    }

    async function loadFromDirectoryHandle(rootHandle){
      cleanupObjectUrls();
      albums = [];
      rootName.textContent = '已读取';
      albumPath.textContent = '';
      setStatus('正在扫描子文件夹','正在读取总目录下的相册图片……',8,true);

      const groups = [];
      let folderIndex = 0;
      for await (const entry of rootHandle.values()){
        if(entry.kind !== 'directory') continue;
        folderIndex++;
        setStatus('正在扫描子文件夹',`正在扫描：${entry.name}`,Math.min(76,10 + folderIndex * 4),true);
        const photos = [];
        await walkDirectoryHandle(entry, entry.name, '', photos);
        if(photos.length) groups.push({title:entry.name, photos});
      }
      await buildAlbumsFromGroups(groups, '本地目录');
    }

    async function walkDirectoryHandle(dirHandle, albumName, subPath, photos){
      const entries = [];
      for await (const entry of dirHandle.values()) entries.push(entry);
      entries.sort((a,b) => naturalCompare(a.name,b.name));

      for(const entry of entries){
        if(entry.kind === 'file'){
          if(!isImageName(entry.name)) continue;
          try{
            const file = await entry.getFile();
            photos.push({
              name:entry.name,
              file,
              rel:[albumName, subPath, entry.name].filter(Boolean).join('/'),
              size:file.size,
              lastModified:file.lastModified || 0
            });
          }catch(error){
            console.warn('读取文件失败：', entry.name, error);
          }
        }else if(entry.kind === 'directory'){
          const nextPath = [subPath, entry.name].filter(Boolean).join('/');
          await walkDirectoryHandle(entry, albumName, nextPath, photos);
        }
      }
    }

    async function loadFromFileList(files){
      cleanupObjectUrls();
      albums = [];
      setStatus('正在读取本地图片',`已发现 ${files.length} 张图片，正在按子文件夹分类……`,10,true);

      const root = inferRootNameFromFiles(files) || '本地目录';
      rootName.textContent = '已读取';
      albumPath.textContent = '';
      const map = new Map();

      files.forEach(file => {
        const rel = file.webkitRelativePath || file.name;
        const parts = rel.split('/').filter(Boolean);
        if(parts.length < 3) return;
        const album = parts[1];
        if(!map.has(album)) map.set(album, []);
        map.get(album).push({name:file.name,file,rel,size:file.size,lastModified:file.lastModified || 0});
      });

      const groups = Array.from(map.entries()).map(([title, photos]) => ({title, photos}));
      await buildAlbumsFromGroups(groups, root);
    }

    async function buildAlbumsFromGroups(groups, rootLabel){
      if(!groups.length){
        cleanupObjectUrls();
        albums = [];
        updateStats();
        showWaitingForClick('没有发现可展示的相册','请确认总目录下面至少有一个子文件夹，并且子文件夹内有图片。');
        rootName.textContent = '未读取';
        albumPath.textContent = '';
        return;
      }

      groups.sort((a,b) => naturalCompare(a.title,b.title));
      const total = groups.reduce((sum,group) => sum + group.photos.length,0);
      let done = 0;

      albums = groups.map(group => {
        group.photos.sort((a,b) => naturalCompare(a.name,b.name));
        const photos = group.photos.map((photo,index) => {
          const url = URL.createObjectURL(photo.file);
          objectUrls.push(url);
          done++;
          if(done % 8 === 0 || done === total){
            setStatus('正在生成数字展厅',`正在生成图片相框：${done}/${total}`,Math.min(98,Math.round(done / total * 78) + 18),false);
          }
          return {...photo,url,order:index + 1,sizeText:formatBytes(photo.size)};
        });
        return {
          title:group.title,
          photos,
          coverUrl:photos[0].url,
          count:photos.length,
          size:photos.reduce((sum,photo) => sum + (photo.size || 0),0)
        };
      });

      setStatus('图集加载完成',`已加载 ${albums.length} 个相册，共 ${total} 张图片。`,100,false,'ok');
      updateStats();
      renderAlbums();
      showAlbums();
      showToast(`加载完成：${albums.length} 个相册，${total} 张图片`);
    }

    function renderAlbums(){
      albumGrid.innerHTML = albums.map((album,index) => `
        <article class="album-card" data-index="${index}" style="animation-delay:${Math.min(index * 35, 420)}ms">
          <div class="album-cover">
            <img src="${album.coverUrl}" alt="${escapeHtml(album.title)}" loading="lazy" />
            </div>
          <div class="album-body">
            <h3 class="album-title">${escapeHtml(album.title)}</h3>
            <div class="meta">
              <span class="pill cyan">${album.count} 张图片</span>
              <span class="pill green">点击进入</span>
              <span class="pill">${formatBytes(album.size)}</span>
            </div>
          </div>
        </article>
      `).join('');

      albumGrid.querySelectorAll('.album-card').forEach(card => {
        card.addEventListener('click', () => openAlbum(Number(card.dataset.index)));
      });
    }

    function openAlbum(index){
      const album = albums[index];
      if(!album) return;
      currentPhotos = album.photos;
      currentAlbumTitle.textContent = `${album.title} · ${album.count} 张`;
      listHead.style.display = 'none';
      galleryHead.classList.add('active');
      notice.classList.add('hidden');
      albumGrid.classList.add('hidden');
      photoGrid.classList.add('active');
      photoGrid.innerHTML = album.photos.map((photo,i) => `
        <article class="photo" data-index="${i}" style="animation-delay:${Math.min(i * 28, 420)}ms">
          <div class="frame-img"><img src="${photo.url}" alt="${escapeHtml(photo.name)}" loading="lazy" /></div>
          <div class="photo-info">
            <b>${escapeHtml(photo.name)}</b>
            <span>${photo.order}/${album.count} · ${photo.sizeText}</span>
          </div>
        </article>
      `).join('');
      photoGrid.querySelectorAll('.photo').forEach(item => {
        item.addEventListener('click', () => openLightbox(Number(item.dataset.index)));
      });
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function showAlbums(){
      listHead.style.display = 'flex';
      galleryHead.classList.remove('active');
      photoGrid.classList.remove('active');
      photoGrid.innerHTML = '';
      if(albums.length){
        notice.classList.add('hidden');
        albumGrid.classList.remove('hidden');
      }else{
        notice.classList.remove('hidden');
        albumGrid.classList.add('hidden');
      }
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function openLightbox(index){
      if(!currentPhotos.length) return;
      currentPhotoIndex = Math.max(0,Math.min(currentPhotos.length - 1,index));
      updateLightbox();
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden','false');
    }

    function updateLightbox(){
      const photo = currentPhotos[currentPhotoIndex];
      if(!photo) return;
      lightboxImg.src = photo.url;
      lightboxCaption.textContent = `${currentPhotoIndex + 1}/${currentPhotos.length} · ${photo.name}`;
    }

    function stepLightbox(delta){
      if(!currentPhotos.length) return;
      currentPhotoIndex = (currentPhotoIndex + delta + currentPhotos.length) % currentPhotos.length;
      updateLightbox();
    }

    function closeLightbox(){
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden','true');
      lightboxImg.removeAttribute('src');
    }

    function tryHardCodedPathAutoLoad(){
      try{
        if(!('ActiveXObject' in window)) return false;
        const fso = new ActiveXObject('Scripting.FileSystemObject');
        const rootPath = HARD_CODED_LOCAL_PATH;
        if(!fso.FolderExists(rootPath)){
          console.warn('固定相册目录不存在：', rootPath);
          return false;
        }
        const rootFolder = fso.GetFolder(rootPath);
        const groups = [];

        const subFolders = new Enumerator(rootFolder.SubFolders);
        for(; !subFolders.atEnd(); subFolders.moveNext()){
          const folder = subFolders.item();
          const photos = [];
          collectActiveXImages(folder, folder.Name, '', photos);
          if(photos.length) groups.push({title:folder.Name, photos});
        }
        if(!groups.length) return false;

        cleanupObjectUrls();
        albums = groups.sort((a,b)=>naturalCompare(a.title,b.title)).map(group => {
          group.photos.sort((a,b)=>naturalCompare(a.name,b.name));
          const photos = group.photos.map((photo,index) => ({...photo,order:index + 1,sizeText:formatBytes(photo.size || 0)}));
          return {title:group.title,photos,coverUrl:photos[0].url,count:photos.length,size:photos.reduce((sum,p)=>sum + (p.size || 0),0)};
        });
        rootName.textContent = '已读取';
        albumPath.textContent = '';
        setStatus('固定目录自动加载完成',`已自动读取固定相册目录：${albums.length} 个相册。`,100,false,'ok');
        updateStats();
        renderAlbums();
        showAlbums();
        return true;
      }catch(error){
        console.warn('固定路径自动读取失败：', error);
        return false;
      }
    }

    function tryActiveXAutoLoad(){
      return tryHardCodedPathAutoLoad();
    }

    function collectActiveXImages(folder, albumName, subPath, photos){
      const files = new Enumerator(folder.Files);
      for(; !files.atEnd(); files.moveNext()){
        const file = files.item();
        if(!isImageName(file.Name)) continue;
        photos.push({
          name:file.Name,
          rel:[albumName,subPath,file.Name].filter(Boolean).join('/'),
          url:pathToFileUrl(file.Path),
          size:Number(file.Size || 0),
          lastModified:0
        });
      }
      const folders = new Enumerator(folder.SubFolders);
      for(; !folders.atEnd(); folders.moveNext()){
        const child = folders.item();
        collectActiveXImages(child, albumName, [subPath,child.Name].filter(Boolean).join('/'), photos);
      }
    }

    function pathToFileUrl(path){
      return 'file:///' + String(path).replace(/\\/g,'/').split('/').map(encodeURIComponent).join('/').replace(/^([A-Za-z])%3A/,'$1:');
    }

    function updateStats(){
      const total = albums.reduce((sum,album) => sum + album.count,0);
      albumCount.textContent = albums.length;
      photoCount.textContent = total;
    }

    function showWaitingForClick(title,text,hint){
      waitingForUserGesture = true;
      setStatus(title,text,54,false);
      notice.classList.remove('hidden');
      albumGrid.classList.add('hidden');
      photoGrid.classList.remove('active');
      noticeTitle.textContent = title;
      noticeText.textContent = text;
      noticeHint.textContent = hint || '当前页面不会显示你的本地目录名称；重新选择后，下次会优先自动读取。';
    }

    function showError(title,text){
      waitingForUserGesture = true;
      setStatus(title,text,100,false,'err');
      notice.classList.remove('hidden');
      albumGrid.classList.add('hidden');
      noticeTitle.textContent = title;
      noticeText.textContent = text;
      noticeHint.textContent = '建议使用新版 Chrome / Edge 浏览器打开。';
    }

    function setStatus(title,text,percent,indeterminate,state){
      statusTitle.textContent = title;
      statusText.textContent = text;
      progressBar.style.width = Math.max(0,Math.min(100,percent || 0)) + '%';
      progress.classList.toggle('loading',!!indeterminate);
      statusDot.classList.remove('ok','err');
      if(state === 'ok') statusDot.classList.add('ok');
      if(state === 'err') statusDot.classList.add('err');
    }

    function showToast(text){
      toast.textContent = text;
      toast.classList.add('active');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('active'),3000);
    }

    function isImageFile(file){ return isImageName(file.name) || (file.type || '').startsWith('image/'); }
    function isImageName(name){ return imageExts.has(String(name).split('.').pop().toLowerCase()); }
    function inferRootNameFromFiles(files){
      const first = files[0]?.webkitRelativePath || '';
      return first.split('/').filter(Boolean)[0] || '';
    }
    function naturalCompare(a,b){ return String(a).localeCompare(String(b),'zh-Hans-CN',{numeric:true,sensitivity:'base'}); }
    function formatBytes(bytes){
      const num = Number(bytes || 0);
      if(num < 1024) return num + ' B';
      if(num < 1024 * 1024) return (num / 1024).toFixed(1) + ' KB';
      if(num < 1024 * 1024 * 1024) return (num / 1024 / 1024).toFixed(1) + ' MB';
      return (num / 1024 / 1024 / 1024).toFixed(2) + ' GB';
    }
    function escapeHtml(str){
      return String(str).replace(/[&<>'"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[s]));
    }
    function cleanupObjectUrls(){
      objectUrls.forEach(url => URL.revokeObjectURL(url));
      objectUrls = [];
    }

    function openDB(dbName = DB_NAME){
      return new Promise((resolve,reject) => {
        const req = indexedDB.open(dbName,1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function storeHandle(handle){
      const db = await openDB(DB_NAME);
      return new Promise((resolve,reject) => {
        const tx = db.transaction(STORE,'readwrite');
        tx.objectStore(STORE).put(handle,HANDLE_KEY);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function readHandleFromDB(dbName){
      const db = await openDB(dbName);
      return new Promise((resolve,reject) => {
        const tx = db.transaction(STORE,'readonly');
        const req = tx.objectStore(STORE).get(HANDLE_KEY);
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
    }
    async function getStoredHandle(){
      try{
        const db = await openDB(DB_NAME);
        return await new Promise((resolve,reject) => {
          const tx = db.transaction(STORE,'readonly');
          const req = tx.objectStore(STORE).get(HANDLE_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      }catch(error){
        console.warn('读取新版本地目录记录失败：', error);
        return null;
      }
    }

    async function clearOldDirectoryCacheOnce(){
      if(!('indexedDB' in window)) return;
      try{
        if(window.localStorage && localStorage.getItem(RESET_MARK_KEY) === '1') return;
      }catch(error){}
      for(const dbName of LEGACY_DB_NAMES){
        await deleteDatabaseSafe(dbName);
      }
      try{
        if(window.localStorage) localStorage.setItem(RESET_MARK_KEY,'1');
      }catch(error){}
    }

    function deleteDatabaseSafe(dbName){
      return new Promise(resolve => {
        try{
          const req = indexedDB.deleteDatabase(dbName);
          req.onsuccess = () => resolve();
          req.onerror = () => resolve();
          req.onblocked = () => resolve();
        }catch(error){
          resolve();
        }
      });
    }
  </script>
</body>
